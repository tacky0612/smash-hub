name: docs-check

on:
  # ブランチ保護の必須チェックにしているため、PR では常に実行する
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".claude/skills/docs-check/**"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ドキュメントのリンク切れ・目次漏れ・ADR を確認
        run: python3 .claude/skills/docs-check/scripts/check_docs.py
