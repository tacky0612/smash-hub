name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smashhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d smashhub_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && go vet -tags=integration ./... && go vet -tags=e2e ./...
      - name: 単体テスト
        run: go test -race ./...
      - name: 結合テスト（PostgreSQL）
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/smashhub_test?sslmode=disable
        run: go test -tags=integration -count=1 ./internal/integrationtest/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 型チェックとビルド
        run: npm run build

  # 2つのインスタンスを Docker で立ち上げ、連合プロトコルでの対戦の一連の流れを検証する
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 2つのインスタンスを起動
        run: docker compose up --build -d --wait
      - name: E2E テスト（Instance1 ⇔ Instance2）
        working-directory: backend
        env:
          INSTANCE1_URL: http://localhost:8080
          INSTANCE2_URL: http://localhost:8090
        run: go test -tags=e2e -count=1 -v ./e2e/...
      - name: 失敗時のログ
        if: failure()
        run: docker compose logs backend1 backend2 web1 web2
      - name: 停止
        if: always()
        run: docker compose down -v
